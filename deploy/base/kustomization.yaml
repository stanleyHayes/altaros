apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared labels, so `kubectl get all -l app.kubernetes.io/name=altar-os`
# finds everything an incident touches.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: altar-os
      app.kubernetes.io/part-of: altar-os

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - certificate.yaml
  - custom-domains.yaml

images:
  - name: altar-os
    newTag: latest
