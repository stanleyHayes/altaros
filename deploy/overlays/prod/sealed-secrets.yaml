# PLACEHOLDER — this file must be replaced before deploying to prod.
#
# Real secrets are sealed with kubeseal so the encrypted form is safe to
# commit; only the sealed-secrets controller running in the target cluster
# holds the key to decrypt them. Encrypting per-cluster is the point: a
# staging SealedSecret cannot be decrypted by the production cluster, so a
# copy-paste between environments fails loudly rather than silently deploying
# the wrong credentials.
#
# To generate:
#
#   kubectl create secret generic altar-secrets \
#     --namespace altar-prod \
#     --dry-run=client -o yaml \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=PAYSTACK_SECRET_KEY=sk_... \
#     --from-literal=PAYSTACK_PUBLIC_KEY=pk_... \
#     --from-literal=PAYSTACK_WEBHOOK_SECRET=sk_... \
#     --from-literal=AT_API_KEY=... \
#     --from-literal=AT_USERNAME=... \
#     --from-literal=RESEND_API_KEY=... \
#     --from-literal=RESEND_FROM_EMAIL=... \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=MONGODB_URI=mongodb+srv://... \
#     --from-literal=REDIS_ADDR=... \
#   | kubeseal --controller-namespace kube-system --format yaml \
#   > deploy/overlays/prod/sealed-secrets.yaml
#
# Note on PAYSTACK_WEBHOOK_SECRET: Paystack signs webhooks with the SECRET KEY
# itself, so set it to the same value as PAYSTACK_SECRET_KEY. Any other value
# silently rejects every real webhook, which looks exactly like Paystack being
# down.
#
# WP-05 makes the service refuse to start in staging or production with any of
# these missing, and names each one — so a bad seal fails at boot rather than
# at the first payment.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: altar-secrets
  namespace: altar-prod
spec:
  encryptedData: {}
  template:
    metadata:
      name: altar-secrets
      namespace: altar-prod
